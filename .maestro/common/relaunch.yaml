# Local runs (ui-check): restarts Cookez Dev but keeps its data, so an open session survives and
# no sign-in is repeated. Puts the light theme back first, in case a previous flow stopped halfway.
# CI and the e2e journeys use launch.yaml (clean state) instead.
appId: com.v2.cookez.dev
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: home-connect
    timeout: 90000
- runFlow:
    file: theme.yaml
    env:
      NAME: light
